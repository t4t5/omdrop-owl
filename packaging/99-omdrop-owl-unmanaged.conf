# NetworkManager must not manage the interfaces omdrop-owl creates.
#
# awdl0 is OWL's tap device: a managed one is given a randomised MAC and no
# IPv6 link-local, and the link-local is the only address a transfer can be
# delivered to. mon0 is the monitor interface OWL injects through.
#
# This is the vendor copy. Override it with a file of the same name in
# /etc/NetworkManager/conf.d/, which NetworkManager reads after this one.
[keyfile]
unmanaged-devices=interface-name:awdl0;interface-name:mon0
