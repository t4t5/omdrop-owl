name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: shellcheck
        # test-card.sh isn't listed: it declares empty variables as `A= B=`
        # (SC1007). --severity=warning skips info-level notes the helper
        # relies on intentionally (word-splitting an argument string and a
        # list).
        run: |
          shellcheck --severity=warning \
            userspace/omdrop-discoverable \
            tools/build-owl.sh tools/stage.sh tools/build-rpm.sh tools/build-deb.sh tools/check-rpm.sh tools/run-tests.sh \
            tests/helpers.bash
      - name: Unit tests
        run: tools/run-tests.sh
